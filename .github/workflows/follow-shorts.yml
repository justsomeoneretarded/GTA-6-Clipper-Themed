name: Check for a finished Shorts batch

on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  actions: write
  contents: read

jobs:
  check:
    uses: justsomeoneretarded/GTA-6-Clipper-shorts/.github/workflows/follow-shorts.yml@main
    with:
      engine: justsomeoneretarded/GTA-6-Clipper-shorts
    secrets:
      CATALOG_TOKEN: ${{ secrets.CATALOG_TOKEN }}
